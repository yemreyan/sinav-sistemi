<!DOCTYPE html>
<html lang="tr">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta http-equiv="Cache-Control" content="no-cache, no-store, must-revalidate">
    <title>FIG TR Judge - Podyum Yönetimi</title>
    <link href="https://fonts.googleapis.com/css2?family=Outfit:wght@300;400;600;800&display=swap" rel="stylesheet">
    <link rel="stylesheet" href="styles.css">
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-app-compat.js"></script>
    <script src="https://www.gstatic.com/firebasejs/10.7.1/firebase-database-compat.js"></script>
</head>

<body>
    <div id="app" style="padding: 20px;">
        <div class="glass-card" style="min-height: 95vh; display: flex; flex-direction: column;">
            <!-- Header -->
            <div
                style="display:flex; justify-content:space-between; align-items:center; margin-bottom:20px; border-bottom: 1px solid var(--glass-border); padding-bottom: 15px;">
                <div>
                    <h1 style="margin-bottom:5px; font-size: 1.8rem;">Podyum Yönetimi</h1>
                    <p style="font-size:1rem; color:var(--text-dim)">Hakemlerin podyum atamalarını buradan yönetin.</p>
                </div>
                <div style="display:flex; gap:10px; align-items: center;">
                    <input type="text" id="manager-search" placeholder="Hakem Ara..." class="form-input"
                        style="width: 250px;">
                    <div class="clock" id="manager-clock"
                        style="font-family: monospace; font-size: 1.2rem; margin-left: 20px;">00:00:00</div>
                </div>
            </div>

            <!-- Content -->
            <div class="table-scroll" style="flex: 1; overflow-y: auto;">
                <table class="data-table" style="width:100%; font-size: 1rem;">
                    <thead style="position: sticky; top: 0; z-index: 10; background: var(--glass-bg);">
                        <tr>
                            <th>Hakem Adı</th>
                            <th>Branş</th>
                            <th>Görev (E/D)</th>
                            <th>Mevcut Podyum</th>
                            <th>İşlemler</th>
                        </tr>
                    </thead>
                    <tbody id="manager-referees-body">
                        <!-- JS ile doldurulacak -->
                    </tbody>
                </table>
            </div>
            <div id="manager-empty" style="text-align:center; padding:40px; color:var(--text-dim); display:none">
                <p>Hakem bulunamadı.</p>
            </div>
        </div>
    </div>

    <!-- Toast Container -->
    <div id="toast-container"></div>

    <script src="app.js?v=2.37"></script>
    <script>
        // Clock
        setInterval(() => {
            const el = document.getElementById('manager-clock');
            if (el) el.textContent = new Date().toLocaleTimeString('tr-TR');
        }, 1000);
    </script>
</body>

</html>
